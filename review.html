<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Review</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --border: #e4e4df; --accent: #2f5bd3; --chip: #eef1fb;
    --again: #c2412d; --hard: #b7791f; --good: #2f7d4f; --easy: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ececea; --muted: #9a9a94;
      --border: #2e2e2b; --accent: #8aa7ff; --chip: #232838;
      --again: #f07a66; --hard: #e3b04b; --good: #6cc895; --easy: #8aa7ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 80px; }
  .nav { display: flex; gap: 4px; margin-bottom: 20px; }
  .nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; }
  .nav a:hover { text-decoration: none; background: var(--border); }
  .nav a.on { background: var(--text); color: var(--bg); }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 2px 0 20px; }
  .stats { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; min-height: 220px; }
  .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card h2 { font-size: 21px; margin: 6px 0 12px; line-height: 1.3; }
  .prompt { color: var(--muted); font-size: 14px; }
  .answer ul { padding-left: 20px; margin: 10px 0; }
  .answer li { margin-bottom: 6px; }
  .answer p { margin: 8px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .chip { background: var(--chip); padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; padding: 10px 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); }
  button small { display: block; color: var(--muted); font-size: 11px; }
  .reveal { width: 100%; margin-top: 14px; background: var(--text); color: var(--bg); border: none; padding: 12px; }
  .again { border-color: var(--again); color: var(--again); }
  .hard { border-color: var(--hard); color: var(--hard); }
  .good { border-color: var(--good); color: var(--good); }
  .easy { border-color: var(--easy); color: var(--easy); }
  .done { text-align: center; padding: 40px 0; }
  .done b { font-size: 20px; display: block; margin-bottom: 4px; }
  .foot { margin-top: 28px; color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
  .foot button { padding: 4px 10px; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <nav class="nav"><a href="./">Zettelkasten</a><a href="glossary.html">Glossary</a><a href="graph.html">Graph</a><a href="review.html" class="on">Review</a></nav>
  <h1>Daily Review</h1>
  <p class="sub">Recall first, then reveal. Notes come back less often as you know them better.</p>
  <div class="stats">
    <div class="stat"><b id="sDue">0</b><span>left today</span></div>
    <div class="stat"><b id="sDone">0</b><span>reviewed today</span></div>
    <div class="stat"><b id="sNew">0</b><span>never seen</span></div>
  </div>
  <div id="stage"></div>
  <div class="foot">
    <button id="exp">Export progress</button>
    <button id="imp">Import progress</button>
    <input id="file" type="file" accept="application/json" hidden>
    <span>Progress is saved in this browser.</span>
  </div>
</main>

<script src="data.js"></script>
<script src="terms.js"></script>
<script>
  const NEW_PER_DAY = 5;
  const INTERVALS = [1, 3, 7, 14, 30, 60, 120]; // days for each level
  const KEY = "kb-review-v1";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const day = (d = new Date()) => d.toLocaleDateString("en-CA"); // YYYY-MM-DD, local time
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return day(d); };

  // Every note and glossary term becomes a card
  const CARDS = [
    ...NOTES.map(n => ({ id: "n:" + slug(n.title), kind: "Note", title: n.title, content: n.content, tags: n.tags })),
    ...TERMS.map(t => ({ id: "g:" + slug(t.term), kind: "Glossary", title: t.term,
      content: "• " + t.definition + (t.example ? "\n• e.g. " + t.example : ""), tags: t.tags || [] })),
  ];

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || { cards: {}, log: {} }; }
    catch { return { cards: {}, log: {} }; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
  let S = load();

  function todayLog() { return S.log[day()] ||= { done: 0, newSeen: 0 }; }

  function queue() {
    const t = day();
    const due = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].due <= t);
    const unseen = CARDS.filter(c => !S.cards[c.id]);
    const newSlots = Math.max(0, NEW_PER_DAY - todayLog().newSeen);
    return { due, fresh: unseen.slice(0, newSlots), unseenCount: unseen.length };
  }

  function renderBody(content) {
    if (!content) return `<p class="prompt">(No extra detail. The title is the idea.)</p>`;
    let html = "", inList = false;
    for (const line of content.split("\n")) {
      if (/^•\s*/.test(line)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${esc(line.replace(/^•\s*/, ""))}</li>`;
      } else if (line.trim()) {
        if (inList) { html += "</ul>"; inList = false; }
        html += `<p>${esc(line)}</p>`;
      }
    }
    return html + (inList ? "</ul>" : "");
  }

  let current = null, revealed = false;

  function render() {
    const { due, fresh, unseenCount } = queue();
    const list = [...due, ...fresh];
    $("sDue").textContent = list.length;
    $("sDone").textContent = todayLog().done;
    $("sNew").textContent = unseenCount;
    if (!list.length) {
      const next = Object.values(S.cards).map(c => c.due).sort()[0];
      $("stage").innerHTML = `<div class="card done"><b>All done for today</b>
        <span class="prompt">${next ? "Next review: " + next : "Come back tomorrow for new notes."}</span></div>`;
      current = null; return;
    }
    current = list[0]; revealed = false;
    const isNew = !S.cards[current.id];
    $("stage").innerHTML = `
      <div class="card">
        <div class="kind">${current.kind}${isNew ? " · new" : ""}</div>
        <h2>${esc(current.title)}</h2>
        <div id="ans" class="answer" hidden>${renderBody(current.content)}
          <div class="chips">${current.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        </div>
        <p class="prompt" id="ask">What do you remember about this? Say it in your head, then reveal.</p>
      </div>
      <button class="reveal" id="rev">Show note <small style="color:inherit;opacity:.6">Space</small></button>
      <div class="actions" id="acts" hidden>
        <button class="again" data-g="0">Again<small>tomorrow</small></button>
        <button class="hard" data-g="1">Hard<small>${preview(1)}</small></button>
        <button class="good" data-g="2">Good<small>${preview(2)}</small></button>
        <button class="easy" data-g="3">Easy<small>${preview(3)}</small></button>
      </div>
      <p class="hint">Keys: Space to reveal · 1–4 to grade</p>`;
  }

  function nextLevel(grade) {
    const lvl = S.cards[current.id]?.level ?? -1;
    if (grade === 0) return 0;
    if (grade === 1) return Math.max(0, lvl);
    if (grade === 2) return Math.min(INTERVALS.length - 1, lvl + 1);
    return Math.min(INTERVALS.length - 1, lvl + 2);
  }
  function preview(grade) {
    const d = INTERVALS[nextLevel(grade)];
    return d === 1 ? "tomorrow" : d < 30 ? `${d} days` : `${Math.round(d / 30)} mo`;
  }

  function reveal() {
    if (!current || revealed) return;
    revealed = true;
    $("ans").hidden = false; $("ask").hidden = true; $("rev").hidden = true; $("acts").hidden = false;
  }

  function grade(g) {
    if (!current || !revealed) return;
    const isNew = !S.cards[current.id];
    const level = nextLevel(g);
    S.cards[current.id] = { level, due: addDays(INTERVALS[level]), last: day() };
    const log = todayLog(); log.done++; if (isNew) log.newSeen++;
    save(); render();
  }

  document.addEventListener("click", e => {
    if (e.target.closest("#rev")) reveal();
    const b = e.target.closest("[data-g]"); if (b) grade(+b.dataset.g);
  });
  document.addEventListener("keydown", e => {
    if (e.key === " ") { e.preventDefault(); reveal(); }
    if (["1", "2", "3", "4"].includes(e.key)) grade(+e.key - 1);
  });

  $("exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = `review-progress-${day()}.json`; a.click();
  };
  $("imp").onclick = () => $("file").click();
  $("file").onchange = async e => {
    try { const d = JSON.parse(await e.target.files[0].text()); if (d.cards) { S = d; save(); render(); } }
    catch { alert("That file isn't a valid progress export."); }
  };

  render();
</script>
</body>
</html>
