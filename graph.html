<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --border: #e4e4df; --accent: #2f5bd3; --edge: #c9c9c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ececea; --muted: #9a9a94;
      --border: #2e2e2b; --accent: #8aa7ff; --edge: #3d3d39;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; }
  a { color: var(--accent); text-decoration: none; }
  header { max-width: 1120px; width: 100%; margin: 0 auto; padding: 32px 16px 8px; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; }
  .nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; }
  .nav a:hover { text-decoration: none; background: var(--border); }
  .nav a.on { background: var(--text); color: var(--bg); }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 2px 0 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend i.sq { border-radius: 2px; }
  #wrap { flex: 1; position: relative; min-height: 420px; max-width: 1120px; width: 100%; margin: 0 auto 16px;
    border: 1px solid var(--border); border-radius: 14px; background: var(--panel); overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .link { stroke: var(--edge); stroke-width: 1.4; }
  .node { cursor: pointer; stroke: var(--panel); stroke-width: 2; }
  .label { font-size: 11px; fill: var(--text); pointer-events: none; paint-order: stroke;
    stroke: var(--panel); stroke-width: 3px; }
  .dim { opacity: .12; }
  #tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 12px; padding: 6px 9px; border-radius: 8px; max-width: 260px; display: none; }
  .hint { position: absolute; bottom: 10px; right: 14px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <nav class="nav"><a href="./">Zettelkasten</a><a href="glossary.html">Glossary</a><a href="graph.html" class="on">Graph</a><a href="review.html">Review</a></nav>
  <h1>Knowledge Graph</h1>
  <p class="sub" id="sub"></p>
  <div class="legend" id="legend"></div>
</header>
<div id="wrap">
  <svg id="svg"></svg>
  <div id="tip"></div>
  <div class="hint">Drag to move · scroll to zoom · hover to focus · click to open</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data.js"></script>
<script src="terms.js"></script>
<script>
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // Topic groups → colors (first matching tag wins)
  const GROUPS = [
    ["AI / ML", ["AUDIO", "LLM", "RL", "AI", "Diffusion", "GANs", "GPU/CUDA"], "#4c78d8"],
    ["Learning & mindset", ["Skill-Learning", "Psychology"], "#d8774c"],
    ["Web", ["Next.js", "web dev", "Javascript"], "#3fa66b"],
    ["Programming & systems", ["python", "Programming", "low-level", "SQL", "Postgres", "Docker", "YAML"], "#9b5fc0"],
    ["Godot / games", ["Godot"], "#c9a227"],
  ];
  const groupOf = tags => GROUPS.find(g => g[1].some(t => tags.includes(t))) || ["Other", [], "#888"];

  const nodes = [
    ...NOTES.map(n => ({ id: n.title, kind: "note", tags: n.tags, url: "./#" + slug(n.title) })),
    ...TERMS.map(t => ({ id: t.term, kind: "term", tags: t.tags || [], url: "glossary.html#" + slug(t.term) })),
  ];
  const ids = new Set(nodes.map(n => n.id));
  const seen = new Set();
  const links = [];
  [...NOTES.map(n => [n.title, n.links]), ...TERMS.map(t => [t.term, t.links])].forEach(([a, ls]) =>
    (ls || []).forEach(b => {
      const k = [a, b].sort().join("→");
      if (ids.has(b) && !seen.has(k)) { seen.add(k); links.push({ source: a, target: b }); }
    }));

  const degree = {};
  links.forEach(l => { degree[l.source] = (degree[l.source] || 0) + 1; degree[l.target] = (degree[l.target] || 0) + 1; });
  nodes.forEach(n => { n.deg = degree[n.id] || 0; n.color = groupOf(n.tags)[2]; });
  const r = n => 5 + Math.sqrt(n.deg) * 3;

  document.getElementById("sub").textContent =
    `${NOTES.length} notes · ${TERMS.length} glossary terms · ${links.length} links`;
  document.getElementById("legend").innerHTML =
    GROUPS.map(g => `<span><i style="background:${g[2]}"></i>${g[0]}</span>`).join("") +
    `<span><i class="sq" style="background:var(--muted)"></i>Glossary term</span>`;

  const svg = d3.select("#svg");
  const wrap = document.getElementById("wrap");
  const W = () => wrap.clientWidth, H = () => wrap.clientHeight;
  const g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.3, 4]).on("zoom", e => g.attr("transform", e.transform)));

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(60).strength(0.7))
    .force("charge", d3.forceManyBody().strength(-160))
    .force("center", d3.forceCenter(W() / 2, H() / 2))
    .force("x", d3.forceX(W() / 2).strength(0.06))
    .force("y", d3.forceY(H() / 2).strength(0.08))
    .force("collide", d3.forceCollide(d => r(d) + 4));

  const link = g.append("g").selectAll("line").data(links).join("line").attr("class", "link");

  const node = g.append("g").selectAll("path").data(nodes).join("path")
    .attr("class", "node")
    .attr("d", d => d.kind === "term"
      ? d3.symbol(d3.symbolSquare, Math.pow(r(d) * 1.9, 2))()
      : d3.symbol(d3.symbolCircle, Math.PI * r(d) * r(d))())
    .attr("fill", d => d.color)
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on("click", (e, d) => { location.href = d.url; });

  const short = s => s.length > 34 ? s.slice(0, 32) + "…" : s;
  const label = g.append("g").selectAll("text").data(nodes).join("text")
    .attr("class", "label").attr("dy", d => r(d) + 12).attr("text-anchor", "middle").text(d => short(d.id));

  // Hover: focus a node and its neighbours
  const nbrs = new Map(nodes.map(n => [n.id, new Set([n.id])]));
  links.forEach(l => { nbrs.get(l.source.id ?? l.source).add(l.target.id ?? l.target); nbrs.get(l.target.id ?? l.target).add(l.source.id ?? l.source); });
  const tip = document.getElementById("tip");
  node.on("mouseenter", (e, d) => {
    const set = nbrs.get(d.id);
    node.classed("dim", n => !set.has(n.id));
    label.classed("dim", n => !set.has(n.id));
    link.classed("dim", l => l.source.id !== d.id && l.target.id !== d.id);
    tip.style.display = "block";
    tip.textContent = d.id + (d.kind === "term" ? " (glossary)" : "") + (d.tags.length ? " · " + d.tags.join(", ") : "");
  }).on("mousemove", e => {
    const b = wrap.getBoundingClientRect();
    tip.style.left = (e.clientX - b.left + 12) + "px"; tip.style.top = (e.clientY - b.top + 12) + "px";
  }).on("mouseleave", () => {
    node.classed("dim", false); label.classed("dim", false); link.classed("dim", false);
    tip.style.display = "none";
  });

  sim.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
    label.attr("x", d => d.x).attr("y", d => d.y);
  });

  window.addEventListener("resize", () => {
    sim.force("center", d3.forceCenter(W() / 2, H() / 2)).force("x", d3.forceX(W() / 2).strength(0.06))
      .force("y", d3.forceY(H() / 2).strength(0.08)).alpha(0.3).restart();
  });
</script>
</body>
</html>
