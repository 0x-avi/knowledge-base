<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zettelkasten</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --border: #e4e4df; --accent: #2f5bd3; --chip: #eef1fb; --chip-on: #2f5bd3; --chip-on-text: #fff;
    --src: #f5ece8; --src-text: #8a4b37;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ececea; --muted: #9a9a94;
      --border: #2e2e2b; --accent: #8aa7ff; --chip: #232838; --chip-on: #8aa7ff; --chip-on-text: #141413;
      --src: #3a2a24; --src-text: #e0b4a3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 80px;
    display: grid; grid-template-columns: 220px 1fr; gap: 28px; }
  header { grid-column: 1 / -1; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 2px 0 0; }
  aside h3, .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .tags { list-style: none; padding: 0; margin: 0 0 24px; }
  .tags button { all: unset; cursor: pointer; display: flex; justify-content: space-between;
    width: 100%; padding: 5px 10px; border-radius: 8px; box-sizing: border-box; }
  .tags button:hover { background: var(--chip); }
  .tags button.on { background: var(--chip-on); color: var(--chip-on-text); }
  .tags .n { color: inherit; opacity: .6; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  input { flex: 1 1 240px; padding: 10px 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  select { padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .card:hover { border-color: var(--accent); }
  .card h2 { font-size: 15px; margin: 0; line-height: 1.35; }
  .card .preview { color: var(--muted); font-size: 13px; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { background: var(--chip); padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .chip.src { background: var(--src); color: var(--src-text); }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  /* note detail */
  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; max-width: 640px;
    width: calc(100% - 32px); background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .note { padding: 24px 26px; }
  .note h2 { margin: 0 0 10px; font-size: 21px; line-height: 1.3; }
  .note ul { padding-left: 20px; margin: 12px 0; }
  .note li { margin-bottom: 6px; }
  .note p { margin: 10px 0; }
  .note .links { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 14px; }
  .note .links a { display: block; padding: 2px 0; }
  .close { float: right; all: unset; cursor: pointer; float: right; font-size: 22px;
    line-height: 1; color: var(--muted); padding: 4px 8px; }
  @media (max-width: 720px) {
    .wrap { grid-template-columns: 1fr; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags button { width: auto; gap: 6px; background: var(--chip); }
  }
  .nav { display: flex; gap: 4px; margin-bottom: 20px; }
  .nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; }
  .nav a:hover { text-decoration: none; background: var(--border); }
  .nav a.on { background: var(--text); color: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav class="nav"><a href="./" class="on">Zettelkasten</a><a href="glossary.html">Glossary</a></nav>
    <h1>Zettelkasten</h1>
    <p class="sub">Atomic notes, linked together.</p>
  </header>
  <aside>
    <h3>Tags</h3>
    <ul class="tags" id="tags"></ul>
  </aside>
  <main>
    <div class="bar">
      <input id="q" type="search" placeholder="Search notes…" autocomplete="off">
      <select id="src"><option value="">All sources</option></select>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </main>
</div>
<dialog id="dlg"><div class="note" id="note"></div></dialog>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const bySlug = Object.fromEntries(NOTES.map(n => [slug(n.title), n]));
  const state = { tag: "", src: "", q: "" };

  // Backlinks: notes that link to this one
  const backlinks = {};
  NOTES.forEach(n => (n.links || []).forEach(t => (backlinks[t] ||= []).push(n.title)));

  function renderTags() {
    const counts = Object.fromEntries(TAGS.map(t => [t, NOTES.filter(n => n.tags.includes(t)).length]));
    const items = [["", "All", NOTES.length], ...TAGS.map(t => [t, t, counts[t]])];
    $("tags").innerHTML = items.map(([v, label, n]) =>
      `<li><button data-tag="${esc(v)}" class="${state.tag === v ? "on" : ""}"><span>${esc(label)}</span><span class="n">${n}</span></button></li>`).join("");
  }

  function renderSources() {
    $("src").innerHTML = `<option value="">All sources</option>` +
      Object.entries(SOURCES).map(([k, s]) => `<option value="${k}">${esc(s.name)}</option>`).join("");
  }

  function preview(content) {
    return content.replace(/^•\s*/gm, "").replace(/\n/g, " · ");
  }

  function renderGrid() {
    const q = state.q.trim().toLowerCase();
    const list = NOTES.filter(n =>
      (!state.tag || n.tags.includes(state.tag)) &&
      (!state.src || n.source === state.src) &&
      (!q || (n.title + " " + n.content + " " + n.tags.join(" ")).toLowerCase().includes(q)));
    $("count").textContent = `${list.length} note${list.length === 1 ? "" : "s"}`;
    $("grid").innerHTML = list.length ? list.map(n => `
      <article class="card" data-slug="${slug(n.title)}">
        <h2>${esc(n.title)}</h2>
        ${n.content ? `<div class="preview">${esc(preview(n.content))}</div>` : ""}
        <div class="chips">
          ${n.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}
          ${n.source ? `<span class="chip src">${esc(SOURCES[n.source].name)}</span>` : ""}
        </div>
      </article>`).join("") : `<p class="empty">No notes match.</p>`;
  }

  function renderBody(content) {
    if (!content) return "";
    let html = "", inList = false;
    for (const line of content.split("\n")) {
      if (/^•\s*/.test(line)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${linkify(line.replace(/^•\s*/, ""))}</li>`;
      } else if (line.trim()) {
        if (inList) { html += "</ul>"; inList = false; }
        html += `<p>${linkify(line)}</p>`;
      }
    }
    return html + (inList ? "</ul>" : "");
  }

  function openNote(s) {
    const n = bySlug[s];
    if (!n) return;
    const related = [...new Set([...(n.links || []), ...(backlinks[n.title] || [])])];
    const src = n.source && SOURCES[n.source];
    $("note").innerHTML = `
      <button class="close" aria-label="Close">×</button>
      <h2>${esc(n.title)}</h2>
      <div class="chips">${n.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      ${renderBody(n.content)}
      ${src ? `<p>Source: <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name)} ↗</a> <span class="chip src">${esc(src.type)}</span></p>` : ""}
      ${related.length ? `<div class="links"><div class="section-label">Linked notes</div>
        ${related.map(t => `<a href="#${slug(t)}">${esc(t)}</a>`).join("")}</div>` : ""}`;
    if (!$("dlg").open) $("dlg").showModal();
  }

  $("tags").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.tag = b.dataset.tag; renderTags(); renderGrid();
  });
  $("q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
  $("src").addEventListener("change", e => { state.src = e.target.value; renderGrid(); });
  $("grid").addEventListener("click", e => {
    const c = e.target.closest(".card"); if (c) location.hash = c.dataset.slug;
  });
  $("dlg").addEventListener("click", e => {
    if (e.target.id === "dlg" || e.target.closest(".close")) $("dlg").close();
  });
  $("dlg").addEventListener("close", () => history.replaceState(null, "", location.pathname));
  window.addEventListener("hashchange", () => openNote(location.hash.slice(1)));

  renderTags(); renderSources(); renderGrid();
  if (location.hash) openNote(location.hash.slice(1));
</script>
</body>
</html>
